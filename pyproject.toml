[project]
name = "saas-architecture"
version = "1.0.0"
description = "Multi-tenant SaaS foundation for isolation, billing, entitlements, and usage metering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "VisionQuantech Custom Commercial License"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
